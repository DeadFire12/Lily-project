name: Build Lily ZIP

on:
  push:
    branches:
      - lily-repair-build
  workflow_dispatch:

jobs:
  repair-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("Lily.py"); s=p.read_text(encoding="utf-8")
          start=s.index("    # =====================================================\n    # RUN THE TOOL\n    # =====================================================")
          end=s.index("# =========================================================\n# NORMAL INTENT ENGINE",start)
          block=r'''    # =====================================================
    # RUN TOOL SAFELY
    # =====================================================

    if tool_intent:
        tool_name = tool_intent.get("tool")
        tool_args = tool_intent.get("args", [])
        try:
            tool_result = tool_manager.run(tool_name, *tool_args)
        except Exception as e:
            print("Lily: The tool failed safely. ❤️")
            print("Reason:", e)
            continue

        if not isinstance(tool_result, dict) or not tool_result.get("success", False):
            print("Lily: The tool failed.")
            print("Reason:", tool_result.get("message", "Unknown error.") if isinstance(tool_result, dict) else tool_result)
            continue

        result = tool_result.get("result")

        if isinstance(result, dict) and result.get("confirmation_required"):
            if tool_name == "delete_path":
                pending_tool_confirmation={"action":"delete","path":result.get("path")}
                print(f"Lily: Are you sure you want to delete {result.get('path')}? Please answer yes or no. ⚠️")
                continue
            if tool_name == "restart_computer":
                pending_tool_confirmation={"action":"restart"}
                print("Lily: Are you sure you want to restart your computer? Please answer yes or no. ⚠️")
                continue
            if tool_name == "shutdown_computer":
                pending_tool_confirmation={"action":"shutdown"}
                print("Lily: Are you sure you want to shut down your computer? Please answer yes or no. ⚠️")
                continue

        if tool_name == "take_screenshot" and isinstance(result, dict):
            print("Lily: Screenshot saved here:" if result.get("success") else "Lily: I couldn't take the screenshot.")
            print(result.get("filename", result.get("error", "Unknown error.")))
        elif tool_name == "read_text_file" and isinstance(result, dict):
            print("Lily: Here's what's inside the file: 📖")
            print(result.get("content", "(The file is empty.)") if result.get("success") else result.get("error", "Unknown error."))
        elif tool_name == "list_files" and isinstance(result, dict):
            print("Lily: Files and folders:")
            for item in result.get("items", []):
                print("-", item.get("type","item"), ":", item.get("name","Unknown"))
        elif tool_name == "search_files" and isinstance(result, dict):
            results=result.get("results",[])
            print("Lily: I found:" if results else "Lily: I couldn't find that file. 🔎")
            for item in results: print("-",item)
        elif isinstance(result, dict):
            for k,v in result.items(): print(f"{k}: {v}")
        elif isinstance(result,(list,tuple)):
            for item in result: print(item)
        else:
            print("Lily:", result)
        continue

'''
          s=s[:start]+block+s[end:]
          # Remove duplicate understand() block.
          dup='''    # =====================================================
    # INTENT ENGINE
    # =====================================================

    intent = understand(
        user
        )

    intent_type = intent["intent"]
    
    key = intent["key"]
    
    value = intent["value"]

'''
          s=s.replace(dup,"",1)
          s=s.replace("f"Lily: Got it! I'll remember that you prefer {value} explanations. ❤️"","f"Lily: Got it! I'll remember your {key} as {value}. ❤️"")
          # Add no/yes fallback to memory confirmation.
          needle='''        elif is_no(user):
    
            print(
                f"Lily: What is your correct "
                f"{pending_key}?"
            )

            waiting_new_value = True

            waiting_memory_confirmation = False

            continue
'''
          if needle in s and 'Please answer yes or no."\n            )\n            continue' not in s[s.find(needle):s.find(needle)+700]:
              s=s.replace(needle,needle+'''        else:
            print("Lily: Please answer yes or no.")
            continue
''',1)
          # Remove stale tool_name blocks that occur after normal direct commands.
          for heading,next_heading in [
              ("# CPU INFO","# MEMORY INFO"),
              ("# BATTERY INFO","# NETWORK INFO"),
              ("# NETWORK INFO","# USER INFO"),
              ("# DATE AND TIME","# OPEN PROGRAM")]:
              a=s.find(heading)
              b=s.find(next_heading,a+1)
              if a!=-1 and b!=-1 and a>b: a=-1
              if a!=-1 and b!=-1:
                  # Keep the following section heading but remove the stale block.
                  s=s[:a]+"# Removed stale tool handler\n\n"+s[b:]
          p.write_text(s,encoding="utf-8")

          q=Path("intent_engine.py"); t=q.read_text(encoding="utf-8")
          t=t.replace('r"Show my like"\n            r"what do i like",','r"Show my like",\n\n            r"what do i like",')
          q.write_text(t,encoding="utf-8")
          PY
          python3 -m py_compile *.py
          find lily_mark_compat -name "*.py" -print0 | xargs -0 -n1 python3 -m py_compile
          rm -rf .git .github __pycache__ backups
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
          rm -f memory.json learning.json state.json main.log
          zip -r Lily-repaired.zip . -x "*.pyc" "*__pycache__*"
      - uses: actions/upload-artifact@v4
        with:
          name: Lily-repaired
          path: Lily-repaired.zip
